name: Build design preview APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/debug/schedule.apk schedule-1.4-design-preview.apk
          sha256sum schedule-1.4-design-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-1.4-design-preview
          path: schedule-1.4-design-preview.apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "design-preview-${GITHUB_RUN_NUMBER}" schedule-1.4-design-preview.apk \
            --target "$GITHUB_SHA" \
            --title "Расписание 1.4 — новый дизайн" \
            --notes "Тестовая сборка с новым дизайном. Подписана ключом отладки GitHub Actions. Для установки поверх версии 1.3 с другой подписью понадобится сначала экспортировать расписание и удалить старое приложение."
